<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hôtel Neptune</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>
<body class="hotelneptune">
    
    <nav id="nav">
        <div id="burger" class="burger"></div>
            <li><a href="index.html">Accueil</a></li>
            <li><a href="destinations.html">Destinations</a></li>
            <li><a href="contact.html">Contactez-nous</a></li>
    </nav>
    

    <div class="pageneptune">

        <div class="photoneptune">
            <li>899,99 €</li>
        </div>

        <div class="paiementneptune">
            <form method="post" action="">
                <label for="email">Votre email : </label>
                <input type="email" placeholder="example@email.com" name="email">
                <br>
                <label for="password">Votre mot de passe : </label>
                <input type="password" placeholder="Motdepasse">
                <br>
                <label for="coordonéesbancaires">Vos coordonées bancaire : </label>
                <input type="coordonéesbancaires" placeholder="xxxx-xxxx-xxxx-xxxx" name="email">
                <br>
                <label for="nomprenom">Veuillez indiquer l'identité sur la carte : </label>
                <input type="nomprenom" placeholder="NOM PRENOM" name="nomprenom">
                <br>
                <label for="dateexpiration">Date d'expiration : </label>
                <input type="dateexpiration" placeholder="**/**" name="dateexpiration">
                <br>
                <label for="cryptogramme">Cryptogramme : </label>
                <input type="cryptogramme" placeholder="***" name="cryptogramme">
                <br>
                <button type="submit">Réserver</button>

            </form>
        </div>

    </div>

    <div class="infoneptune">
    <p>Réservation de 7 jours
    <br>
    <p>Mexique, Puerto Morelos, Riviera Maya
    <br>
    <p>10 Restaurants à thème
    <br>
    <p>Restaurant buffet international
    <br>
    <p>Zone de Bowling, 2 théâtres
    <br>
    <p>Centre Spa</p>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
